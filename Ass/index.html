<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Биполярная система мироустройства Мухамедзянова Дания</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f3efe6;
            background-image: radial-gradient(#d9ceb8 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .vintage-panel {
            background: #fbf9f4;
            border: 3px solid #c8b79b;
            box-shadow: 0 12px 30px -8px rgba(0, 0, 0, 0.15);
        }
        .poster-wrapper {
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            border: 6px solid #2d1e12;
            border-radius: 4px;
            overflow: hidden;
            background: #111;
        }
        .hotspot {
            position: absolute;
            cursor: pointer;
            border: 2px dashed rgba(255, 230, 150, 0.7);
            background: rgba(255, 200, 50, 0.12);
            transition: all 0.25s ease-in-out;
            border-radius: 6px;
        }
        .hotspot:hover, .hotspot.active {
            background: rgba(234, 179, 8, 0.35);
            border: 2px solid #eab308;
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.7);
            transform: scale(1.01);
        }
        @keyframes subtleGlow {
            0% { opacity: 0.8; }
            50% { opacity: 1; border-color: #f59e0b; }
            100% { opacity: 0.8; }
        }
        .hotspot-pulse {
            animation: subtleGlow 2.5s infinite;
        }
    </style>
</head>
<body class="font-sans text-stone-900 min-h-screen flex flex-col justify-between">

    <header class="bg-stone-900 text-stone-100 py-5 px-4 shadow-xl border-b-4 border-amber-700">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="text-center sm:text-left">
                <span class="text-xs uppercase tracking-widest text-amber-400 font-semibold">Всемирная история • 1945–1991 гг.</span>
                <h1 class="text-2xl sm:text-3xl md:text-4xl font-serif font-bold tracking-wide mt-1">Биполярная система мироустройства</h1>
            </div>
            <div class="flex items-center gap-3 bg-stone-800 px-4 py-2 rounded-lg border border-stone-700">
                <i class="fa-solid fa-map-location-dot text-amber-400 text-xl"></i>
                <div class="text-sm">
                    <p class="font-medium text-stone-200">Интерактивный постер</p>
                    <p class="text-stone-400 text-xs">Исследуйте зоны на изображении</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl w-full mx-auto p-4 md:p-6 lg:p-8 flex-grow grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- Left: Poster Column (7 cols) -->
        <div class="lg:col-span-7 flex flex-col items-center w-full">
            <div class="vintage-panel p-3 sm:p-4 rounded-xl w-full">
                <div class="flex items-center justify-between pb-3 mb-3 border-b border-stone-300">
                    <div>
                        <h3 class="font-serif font-bold text-base sm:text-lg text-stone-900">Исторический плакат-карикатура</h3>
                        <p class="text-xs text-stone-600">Нажмите на области постера для анализа</p>
                    </div>
                    <button onclick="selectElement('overview')" class="text-xs bg-stone-200 hover:bg-stone-300 text-stone-800 px-3 py-1.5 rounded-md font-medium transition flex items-center gap-1">
                        <i class="fa-solid fa-rotate-right"></i> Сброс
                    </button>
                </div>

                <!-- Poster Wrapper containing ONLY the uploaded poster image -->
                <div class="poster-wrapper w-relative group">
                    <!-- EXACT user uploaded image as the singular visual asset -->
                    <img src="img slay\аоваоаоаооа.jpeg" alt="Биполярная система мироустройства" class="w-full h-auto block object-cover">

                    <!-- Hotspot 1: USA / West (Left side) -->
                    <div class="hotspot hotspot-pulse" style="top: 10%; left: 3%; width: 31%; height: 78%;" 
                         onclick="selectElement('usa')" 
                         title="США и Западный блок">
                        <span class="absolute top-2 left-2 bg-blue-900 text-white text-[10px] sm:text-xs px-2 py-0.5 rounded shadow font-bold">
                            1. США (Запад)
                        </span>
                    </div>

                    <!-- Hotspot 2: Split Globe / Cold War / Iron Curtain (Center) -->
                    <div class="hotspot hotspot-pulse" style="top: 10%; left: 36%; width: 28%; height: 48%;" 
                         onclick="selectElement('coldwar')" 
                         title="Холодная война и Железный занавес">
                        <span class="absolute top-2 left-1/2 -translate-x-1/2 bg-stone-900 text-white text-[10px] sm:text-xs px-2 py-0.5 rounded shadow font-bold whitespace-nowrap">
                            2. Раскол мира
                        </span>
                    </div>

                    <!-- Hotspot 3: Nuclear Balance & Missiles (Bottom Center) -->
                    <div class="hotspot hotspot-pulse" style="top: 60%; left: 36%; width: 28%; height: 28%;" 
                         onclick="selectElement('nuclear')" 
                         title="Ядерное сдерживание">
                        <span class="absolute bottom-2 left-1/2 -translate-x-1/2 bg-amber-800 text-white text-[10px] sm:text-xs px-2 py-0.5 rounded shadow font-bold whitespace-nowrap">
                            3. Ядерный баланс
                        </span>
                    </div>

                    <!-- Hotspot 4: USSR / East (Right side) -->
                    <div class="hotspot hotspot-pulse" style="top: 10%; left: 66%; width: 31%; height: 78%;" 
                         onclick="selectElement('ussr')" 
                         title="СССР и Восточный блок">
                        <span class="absolute top-2 right-2 bg-red-900 text-white text-[10px] sm:text-xs px-2 py-0.5 rounded shadow font-bold">
                            4. СССР (Восток)
                        </span>
                    </div>
                </div>

                <!-- Quick Selection Tab Bar -->
                <div class="mt-4 grid grid-cols-2 sm:grid-cols-5 gap-2">
                    <button onclick="selectElement('overview')" id="tab-overview" class="p-2 text-xs font-semibold rounded border border-stone-400 text-stone-800 bg-white hover:bg-stone-100 transition text-center col-span-2 sm:col-span-1">
                        <i class="fa-solid fa-book-open block mb-1"></i> Обзор
                    </button>
                    <button onclick="selectElement('usa')" id="tab-usa" class="p-2 text-xs font-semibold rounded border border-blue-800 text-blue-900 bg-blue-50 hover:bg-blue-100 transition text-center">
                        <i class="fa-solid fa-flag-usa block mb-1"></i> США
                    </button>
                    <button onclick="selectElement('coldwar')" id="tab-coldwar" class="p-2 text-xs font-semibold rounded border border-stone-600 text-stone-800 bg-stone-100 hover:bg-stone-200 transition text-center">
                        <i class="fa-solid fa-bolt block mb-1"></i> Раскол
                    </button>
                    <button onclick="selectElement('nuclear')" id="tab-nuclear" class="p-2 text-xs font-semibold rounded border border-amber-700 text-amber-900 bg-amber-50 hover:bg-amber-100 transition text-center">
                        <i class="fa-solid fa-atom block mb-1"></i> Ядерный щит
                    </button>
                    <button onclick="selectElement('ussr')" id="tab-ussr" class="p-2 text-xs font-semibold rounded border border-red-800 text-red-900 bg-red-50 hover:bg-red-100 transition text-center">
                        <i class="fa-solid fa-hammer block mb-1"></i> СССР
                    </button>
                </div>
            </div>
        </div>

        <!-- Right: Detailed Historical Card Column (5 cols) -->
        <div class="lg:col-span-5 w-full">
            <div id="info-card" class="vintage-panel p-6 rounded-xl transition-all duration-300 min-h-[480px] flex flex-col justify-between">
                <!-- Injected dynamically via JS -->
            </div>
        </div>
    </main>

    <footer class="bg-stone-900 text-stone-400 py-4 px-6 text-center text-xs sm:text-sm border-t border-stone-800 mt-8">
        <p>Спасибо за внимание!</p>
    </footer>

    <script>
        const historicalData = {
            overview: {
                title: "Биполярная система мироустройства Мухмедзянова Дания 9 Б",
                subtitle: "Архитектура международных отношений (1945–1991)",
                badge: "Общая характеристика",
                badgeColor: "bg-stone-800 text-stone-100",
                icon: "fa-earth-americas",
                description: "После разгрома фашистского блока во Второй мировой войне мировой порядок перестал быть евроцентричным. На вершине глобальной мощи остались две сверхдержавы с противоположными идеологиями — США и СССР.",
                details: [
                    "<strong>Два полюса:</strong> Разделение планеты на капиталистический Запад (НАТО) и социалистический Восток (Организация Варшавского договора).",
                    "<strong>Холодная война:</strong> Противостояние велось во всех сферах — экономике, культуре, науке и гонке вооружений без прямого столкновения армий.",
                    "<strong>Ключевые институты:</strong> ООН как глобальная трибуна, военно-политические блоки и экономические союзы (План Маршалла и СЭВ)."
                ],
                quote: "«Мир оказался разделен невидимой границей Железного занавеса, где стабильность держалась на паритете сил»."
            },
            usa: {
                title: "США и Западный блок (Капитализм)",
                subtitle: "Либеральная демократия и рыночная экономика",
                badge: "Запад / Капитализм",
                badgeColor: "bg-blue-900 text-white",
                icon: "fa-landmark-dome",
                description: "США возглавили лагерь свободных рыночных экономик и демократий западного типа, объединив вокруг себя страны Западной Европы и Тихоокеанского региона.",
                details: [
                    "<strong>Идеология и ценности:</strong> Частная собственность, свобода предпринимательства, парламентаризм и индивидуальные права.",
                    "<strong>Экономическая экспансия:</strong> План Маршалла (1947 г.) позволил восстановить разрушенную Европу и привязать её к доллару.",
                    "<strong>Военный альянс:</strong> Создание НАТО (1949 г.) как гарантия коллективной обороны.",
                    "<strong>Символы на плакате:</strong> Статуя Свободы с факелом, американский флаг и современные небоскребы."
                ],
                quote: "«Капиталистический полюс сделал ставку на технологическое лидерство, частный капитал и открытый рынок»."
            },
            ussr: {
                title: "СССР и Восточный блок (Социализм)",
                subtitle: "Плановая экономика и марксистско-ленинская идеология",
                badge: "Восток / Социализм",
                badgeColor: "bg-red-900 text-white",
                icon: "fa-hammer",
                description: "Советский Союз объединил вокруг себя страны Восточной Европы и Евразии, выстроив жесткую вертикаль социалистического лагеря.",
                details: [
                    "<strong>Идеология и ценности:</strong> Общественная собственность, плановое хозяйство, руководящая роль компартии и коллективизм.",
                    "<strong>Экономическое сотрудничество:</strong> Создание Совета экономической взаимопомощи (СЭВ) для координации соцстран.",
                    "<strong>Военный альянс:</strong> Организация Варшавского договора (1955 г.) в ответ на включение ФРГ в НАТО.",
                    "<strong>Символы на плакате:</strong> Фигура рабочего с молотом и красным знаменем, Кремлевская башня и индустриальный пейзаж."
                ],
                quote: "«Советский полюс опирался на мощный военно-промышленный комплекс и идею всемирной победы социализма»."
            },
            coldwar: {
                title: "Холодная война и Железный занавес",
                subtitle: "Глобальное геополитическое противостояние",
                badge: "Раскол мира",
                badgeColor: "bg-stone-700 text-white",
                icon: "fa-bolt",
                description: "Термин «Холодная война» отражает состояние острого соперничества без объявления полномасштабной войны между сверхдержавами.",
                details: [
                    "<strong>Железный занавес:</strong> Политический барьер, разделивший Европу на враждебные лагеря (выражение У. Черчилля).",
                    "<strong>Космическая гонка:</strong> Борьба за первенство в освоении космоса (первый спутник СССР, высадка США на Луну).",
                    "<strong>Локальные конфликты:</strong> Война в Корее, Вьетнам, Карибский кризис — столкновения сверхдержав через третьи страны."
                ],
                quote: "«Противостояние велось на грани фола, балансируя между дипломатией и угрозой катастрофы»."
            },
            nuclear: {
                title: "Ядерное сдерживание и Баланс сил",
                subtitle: "Концепция гарантированного взаимного уничтожения (MAD)",
                badge: "Ядерный паритет",
                badgeColor: "bg-amber-800 text-white",
                icon: "fa-atom",
                description: "Появление термоядерного оружия у обеих сверхдержав создало уникальную ситуацию: прямая война стала самоубийством для человечества.",
                details: [
                    "<strong>Баланс страха:</strong> Любой превентивный удар гарантировал ответный смертоносный удар агрессору.",
                    "<strong>Гонка вооружений:</strong> Накопление тысяч ядерных ракет на боевом дежурстве.",
                    "<strong>Договоры о контроле:</strong> Позже были подписаны соглашения ОСВ-1, ОСВ-2 и ДРСМД для снижения рисков случайной войны."
                ],
                quote: "«Оружие невероятной разрушительной силы парализовало возможность Третьей мировой войны на десятилетия»."
            }
        };

        function selectElement(key) {
            const data = historicalData[key] || historicalData.overview;
            
            // Highlight active tab
            document.querySelectorAll('[id^="tab-"]').forEach(btn => {
                btn.classList.remove('ring-2', 'ring-amber-500', 'font-bold', 'bg-amber-100');
            });
            const activeTab = document.getElementById('tab-' + key);
            if (activeTab) {
                activeTab.classList.add('ring-2', 'ring-amber-500', 'font-bold');
            }

            // Render info card content
            const card = document.getElementById('info-card');
            card.innerHTML = `
                <div>
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-xs uppercase tracking-wider px-3 py-1 rounded-full font-bold ${data.badgeColor}">
                            <i class="fa-solid ${data.icon} mr-1"></i> ${data.badge}
                        </span>
                        <span class="text-xs text-stone-500 font-mono">РЕЖИМ: ${key.toUpperCase()}</span>
                    </div>
                    <h2 class="text-xl sm:text-2xl font-serif font-bold text-stone-900 mb-1">${data.title}</h2>
                    <p class="text-amber-800 font-medium text-xs sm:text-sm mb-3">${data.subtitle}</p>
                    
                    <p class="text-stone-700 leading-relaxed mb-4 text-sm">${data.description}</p>
                    
                    <div class="border-t border-stone-300 pt-3 mb-4">
                        <h4 class="font-bold text-xs uppercase text-stone-500 tracking-wider mb-2">Исторические факты:</h4>
                        <ul class="space-y-2 text-xs sm:text-sm text-stone-700">
                            ${data.details.map(item => `<li class="flex items-start"><i class="fa-solid fa-check text-amber-600 mt-1 mr-2 flex-shrink-0"></i><span>${item}</span></li>`).join('')}
                        </ul>
                    </div>
                </div>

                <div class="bg-amber-50 border-l-4 border-amber-600 p-3 rounded-r-lg italic text-xs text-stone-700 mt-4">
                    ${data.quote}
                </div>
            `;
        }

        // Initialize on load
        window.onload = function() {
            selectElement('overview');
        };
    </script>
</body>
</html>
